name: Deploy VELTRIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      - name: Install dependencies
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Package.json:"
          cat package.json
          echo "Installing dependencies..."
          npm install --verbose

      - name: Build VELTRIX
        run: |
          echo "Starting VELTRIX build..."
          npm run build --verbose

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
